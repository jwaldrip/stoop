name: W7 follow-ups review correction

on:
  push:
    branches: [probe/w7fu-review-fix]

permissions:
  contents: read

jobs:
  focused:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check changed files
        run: |
          rustfmt --edition 2021 --config skip_children=true --check tests/units_common/mod.rs tests/units_review_r2.rs
          cargo clippy --test units_review_r2 -- -D warnings
      - name: Check reviewer regression and validity class
        run: |
          cargo test --test units_review_r2 r10x_stale_held_proofs_must_not_excuse_a_required_full_run -- --nocapture --test-threads=1
          cargo test --test units_review_r2 r11_ -- --nocapture --test-threads=1
      - name: Check prior boundaries
        run: |
          cargo test --test units_review_r2 r7_ -- --nocapture --test-threads=1
          cargo test --test units_review_r2 r8_ -- --nocapture --test-threads=1
          cargo test --test units_review_r2 r9_ -- --nocapture --test-threads=1
          cargo test --test units_review_r2 r9x_ -- --nocapture --test-threads=1
          cargo test --test units_review_r2 r10_ -- --nocapture --test-threads=1
          cargo test --test units_review_r2 e3_gap_accepts_only_the_two_owner_approved_shapes -- --nocapture
          cargo test --test units_review_r2 e3_sticky_retry_requires_the_original_unchanged_runner_only_failures -- --nocapture
