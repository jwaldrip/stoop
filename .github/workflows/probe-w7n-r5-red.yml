name: PR 86 round 5 red controls
on:
  push:
    branches: ['probe/w7n-r5-red-1125']
permissions:
  contents: read
jobs:
  controls:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Require both known wrong verdicts on the unmodified head
        shell: bash
        run: |
          set -eu
          for test in r5_a_head_removed_catalog_directory_is_not_optional r5_e2_head_formerly_ignored_statted_unit_needs_full; do
            log="$RUNNER_TEMP/$test.log"
            if cargo test --test units_review_r2 "$test" -- --nocapture --test-threads=1 > "$log" 2>&1; then
              cat "$log"
              echo "Unexpected success: $test" >&2
              exit 1
            fi
            cat "$log"
            grep -F 'exit=0 direct=1' "$log"
            grep -F 'the full command returned 1 on the same tree' "$log"
          done
