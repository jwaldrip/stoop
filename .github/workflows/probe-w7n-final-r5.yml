name: PR 86 round 5 final probe (w7n, never merge)

on:
  push:
    branches: ['probe/w7n-final-r5']

concurrency:
  group: probe-w7n-final-r5-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  suite:
    name: fmt, clippy, full suite, base differentials (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: c084c6040dde1870493dd09b8f8e40913d94358f
          path: base
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install the shells the hook tests run under
        run: sudo apt-get update && sudo apt-get install -y zsh fish dash
      - name: Compile the pinned merge base
        run: cargo build --manifest-path base/Cargo.toml --target-dir "$RUNNER_TEMP/base-target"
      - name: Format and lint the head
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
      - name: Full suite on the head, with the merge base for the differentials
        env:
          STOOP_BASE_BIN: ${{ runner.temp }}/base-target/debug/stoop
          STOOP_REVIEW_BASE_BIN: ${{ runner.temp }}/base-target/debug/stoop
        run: cargo test
      - name: Round five differentials, ignored tests, against the merge base
        env:
          STOOP_BASE_BIN: ${{ runner.temp }}/base-target/debug/stoop
          STOOP_REVIEW_BASE_BIN: ${{ runner.temp }}/base-target/debug/stoop
        run: cargo test --test units_review_r2 r5_ -- --ignored --nocapture --test-threads=1
      - name: Switch-off parity against the merge base (ignored differentials)
        env:
          STOOP_BASE_BIN: ${{ runner.temp }}/base-target/debug/stoop
        run: cargo test --test legacy_path_differential -- --ignored --test-threads=1
      - name: Wider seeded models on the head
        env:
          STOOP_MODEL_SEEDS: "40"
          STOOP_RUNNER_SEEDS: "40"
          STOOP_R2_SEEDS: "40"
        run: |
          cargo test --test units_split model_split_runs_give_the_full_runs_verdict -- --nocapture
          cargo test --test units_split_runner -- --nocapture
          cargo test --test units_review_r2 r2_e3_flag_readers_model -- --nocapture
