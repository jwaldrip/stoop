name: W7 follow-ups review mutants

on:
  push:
    branches: [probe/w7fu-r11-mutants]

permissions:
  contents: read

jobs:
  mutant:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mutant:
          - FU1-ignore-runner-file
          - FU2-ignore-runner-flag
          - FU3-old-proof-as-current
          - FU4-unrelated-failure-sticky
          - FU5-changed-failure-sticky
          - FU6-unchanged-flag-origin
          - FU7-no-current-content-reader
          - FU8-non-runner-gap
          - FU9-independent-policy-sticky
          - FU10-ignore-guard
          - FU11-ignore-inputs
          - FU12-ignore-outputs
          - FU13-unvalidated-sticky
          - FU14-stale-proof-for-e5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Apply mutant and require its named test to fail
        env:
          MUTANT: ${{ matrix.mutant }}
        run: |
          set -eu
          killer=$(python3 .github/w7fu-review/r11-mutants.py "$MUTANT")
          echo "MUTANT=$MUTANT KILLER=$killer"
          set +e
          cargo test --test units_review_r2 "$killer" -- --exact --nocapture > result.log 2>&1
          status=$?
          set -e
          cat result.log
          test "$status" -ne 0
          grep -F "test $killer ... FAILED" result.log
          if grep -F 'could not compile' result.log; then exit 1; fi
          echo "KILLED $MUTANT BY $killer"
