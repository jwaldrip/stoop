name: PR 86 round 4 final probe (w7m, never merge)

on:
  push:
    branches: ['probe/w7m-final']

concurrency:
  group: probe-w7m-final-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  red-baseline:
    name: round four controls on 268c6ef (x86-64)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/units-completion
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install fixture shells
        run: sudo apt-get update && sudo apt-get install -y zsh fish dash
      - name: Restore the prior design and require each regression to fail
        run: |
          set -euo pipefail
          for file in src/run.rs src/units/attribution.rs src/units/bundle.rs src/units/engine.rs src/units/subset.rs; do
            git show "268c6ef:$file" > "$file"
          done
          for test in r4_a_head_failing_excuser_takes_the_full_form r4_b_head_departed_unit_required_by_the_runner_takes_the_full_form t1_an_outside_root_input_change_beside_an_own_file_edit_takes_the_full_form t1_an_absent_input_that_appears_in_an_unlisted_directory_takes_the_full_form r5c_a_new_unit_that_the_runner_policy_rejects_takes_the_full_form; do
            log="$RUNNER_TEMP/$test.log"
            if cargo test --test units_review_r2 -- --exact "$test" > "$log" 2>&1; then
              cat "$log"
              echo "EXPECTED FAILURE DID NOT OCCUR: $test"
              exit 1
            fi
            cat "$log"
            grep -Fqx "test $test ... FAILED" "$log"
            if grep -Eq 'the whole proof did not record the outside input|unit c did not record the outside input' "$log"; then
              echo "INVALID FIXTURE: $test"
              exit 1
            fi
            echo "RED BASELINE $test"
          done

  compile:
    name: fmt, clippy and every target (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x86-64, runner: ubuntu-latest}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/units-completion
          fetch-depth: 0
      - name: Identify the product revision and restore probe controls
        run: |
          git rev-parse HEAD
          git show "$GITHUB_SHA:.github/w7m-author.py" > .github/w7m-author.py
          git show "$GITHUB_SHA:.github/w7m-round2.py" > .github/w7m-round2.py
          git show "$GITHUB_SHA:.github/w7m-new-mutants.py" > .github/w7m-new-mutants.py
          git show "$GITHUB_SHA:tests/probe_w7i.rs" > tests/probe_w7i.rs
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install the shells the hook tests run under
        run: sudo apt-get update && sudo apt-get install -y zsh fish dash
      - name: Format and lint every target
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
      - name: Build every test binary
        run: cargo test --no-run --all-targets

  full:
    name: full suite (${{ matrix.arch }})
    needs: compile
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x86-64, runner: ubuntu-latest}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/units-completion
          fetch-depth: 0
      - name: Identify the product revision and restore probe controls
        run: |
          git rev-parse HEAD
          git show "$GITHUB_SHA:.github/w7m-author.py" > .github/w7m-author.py
          git show "$GITHUB_SHA:.github/w7m-round2.py" > .github/w7m-round2.py
          git show "$GITHUB_SHA:.github/w7m-new-mutants.py" > .github/w7m-new-mutants.py
          git show "$GITHUB_SHA:tests/probe_w7i.rs" > tests/probe_w7i.rs
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install the shells the hook tests run under
        run: sudo apt-get update && sudo apt-get install -y zsh fish dash
      - name: Full suite, every failure reported
        run: cargo test --no-fail-fast

  adversarial:
    name: round 4 controls against the base and the head (${{ matrix.arch }})
    needs: compile
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x86-64, runner: ubuntu-latest}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/units-completion
          fetch-depth: 0
      - name: Identify the product revision and restore probe controls
        run: |
          git rev-parse HEAD
          git show "$GITHUB_SHA:.github/w7m-author.py" > .github/w7m-author.py
          git show "$GITHUB_SHA:.github/w7m-round2.py" > .github/w7m-round2.py
          git show "$GITHUB_SHA:.github/w7m-new-mutants.py" > .github/w7m-new-mutants.py
          git show "$GITHUB_SHA:tests/probe_w7i.rs" > tests/probe_w7i.rs
      - uses: actions/checkout@v4
        with:
          ref: c084c6040dde1870493dd09b8f8e40913d94358f
          path: base
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install the shells the hook tests run under
        run: sudo apt-get update && sudo apt-get install -y zsh fish dash
      - name: Base binary
        run: cd base && cargo build --release
      - name: Reviewer's R4a and R4b against the base binary, and the head
        env:
          STOOP_REVIEW_BASE_BIN: ${{ github.workspace }}/base/target/release/stoop
        run: |
          cargo test --test units_review_r2 r4_a_failing_excuser_must_not_promote_another_units_stat -- --ignored --nocapture
          cargo test --test units_review_r2 r4_departed_unit_path_used_by_the_full_runner_is_not_optional -- --ignored --nocapture
      - name: Round 4 head controls and derived holes
        run: |
          cargo test --test units_review_r2 r4_ -- --nocapture
          cargo test --test units_review_r2 t1_ -- --nocapture
          cargo test --test units_review_r2 r5c_ -- --nocapture
          cargo test --test units_review_r2 r4c_ -- --nocapture
      - name: Merge-base control and the whole-file review tests
        env:
          STOOP_REVIEW_BASE_BIN: ${{ github.workspace }}/base/target/release/stoop
        run: |
          cargo test --release --test units_review_r2 r3_merge_base_control_for_both_wrong_verdicts -- --ignored --nocapture
          cargo test --test units_review_w7_3 -- --nocapture
          cargo test --test probe_w7i -- --nocapture
          cargo test --test units_split s3_appending_an_empty_line_to_c_runs_c_only -- --exact --nocapture
          cargo test --test units_split an_edited_file_a_unit_reads_makes_that_unit_affected -- --exact --nocapture

  parity:
    name: switch-off parity against the base c084c60 (${{ matrix.arch }})
    needs: compile
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x86-64, runner: ubuntu-latest}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/units-completion
          fetch-depth: 0
      - name: Identify the product revision and restore probe controls
        run: |
          git rev-parse HEAD
          git show "$GITHUB_SHA:.github/w7m-author.py" > .github/w7m-author.py
          git show "$GITHUB_SHA:.github/w7m-round2.py" > .github/w7m-round2.py
          git show "$GITHUB_SHA:.github/w7m-new-mutants.py" > .github/w7m-new-mutants.py
          git show "$GITHUB_SHA:tests/probe_w7i.rs" > tests/probe_w7i.rs
      - uses: actions/checkout@v4
        with:
          ref: c084c6040dde1870493dd09b8f8e40913d94358f
          path: base
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install the shells the hook tests run under
        run: sudo apt-get update && sudo apt-get install -y zsh fish dash
      - name: Base binary
        run: cd base && cargo build --release
      - name: D1 to D20 and legacy_paths_match_the_base, against the base binary
        env:
          STOOP_BASE_BIN: ${{ github.workspace }}/base/target/release/stoop
        run: cargo test --release --test legacy_path_differential -- --ignored --test-threads=1 --nocapture
      - name: units_head_compat, against the base binary
        env:
          STOOP_BASE_BIN: ${{ github.workspace }}/base/target/release/stoop
        run: cargo test --release --test units_head_compat -- --ignored --nocapture
      - name: legacy_2a, which reads no base binary
        run: cargo test --release --test legacy_2a_differential -- --nocapture

  units:
    name: units_* binaries, 20 runs each, shard ${{ matrix.shard }} (${{ matrix.arch }})
    needs: compile
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x86-64, runner: ubuntu-latest, shard: 0}
          - {arch: x86-64, runner: ubuntu-latest, shard: 1}
          - {arch: x86-64, runner: ubuntu-latest, shard: 2}
          - {arch: x86-64, runner: ubuntu-latest, shard: 3}
          - {arch: arm64, runner: ubuntu-24.04-arm, shard: 0}
          - {arch: arm64, runner: ubuntu-24.04-arm, shard: 1}
          - {arch: arm64, runner: ubuntu-24.04-arm, shard: 2}
          - {arch: arm64, runner: ubuntu-24.04-arm, shard: 3}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/units-completion
          fetch-depth: 0
      - name: Identify the product revision and restore probe controls
        run: |
          git rev-parse HEAD
          git show "$GITHUB_SHA:.github/w7m-author.py" > .github/w7m-author.py
          git show "$GITHUB_SHA:.github/w7m-round2.py" > .github/w7m-round2.py
          git show "$GITHUB_SHA:.github/w7m-new-mutants.py" > .github/w7m-new-mutants.py
          git show "$GITHUB_SHA:tests/probe_w7i.rs" > tests/probe_w7i.rs
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install the shells the hook tests run under
        run: sudo apt-get update && sudo apt-get install -y zsh fish dash
      - name: Each units binary of this shard, 20 times, with default threads
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          status=0
          index=0
          for file in tests/units_*.rs; do
            name=$(basename "$file" .rs)
            mine=$((index % 4))
            index=$((index + 1))
            [ "$mine" = "$SHARD" ] || continue
            passed=0
            for run in $(seq 1 20); do
              if cargo test --test "$name" > "/tmp/units-$name-$run.log" 2>&1; then
                passed=$((passed + 1))
              else
                echo "FAILED $name run $run"
                grep -E "panicked|FAILED" "/tmp/units-$name-$run.log" | head -20
                status=1
              fi
            done
            echo "$name: $passed of 20 runs passed"
          done
          exit $status

  s7:
    name: S7 decide cost at 1024 units, base and product (x86-64)
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/units-completion
          fetch-depth: 0
      - name: Identify the product revision and restore probe controls
        run: |
          git rev-parse HEAD
          git show "$GITHUB_SHA:.github/w7m-author.py" > .github/w7m-author.py
          git show "$GITHUB_SHA:.github/w7m-round2.py" > .github/w7m-round2.py
          git show "$GITHUB_SHA:.github/w7m-new-mutants.py" > .github/w7m-new-mutants.py
          git show "$GITHUB_SHA:tests/probe_w7i.rs" > tests/probe_w7i.rs
      - uses: actions/checkout@v4
        with:
          ref: c084c6040dde1870493dd09b8f8e40913d94358f
          path: base
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Base cost
        run: |
          set -euo pipefail
          cd base
          STOOP_BENCH_UNITS=1024 cargo test --release --test units_decide decide_cost -- --ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/s7-base.log"
      - name: Product cost
        run: |
          set -euo pipefail
          STOOP_BENCH_UNITS=1024 cargo test --release --test units_decide decide_cost -- --ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/s7-head.log"
  mutants-author:
    name: author's matrix, 36 mutants with baseline (Linux x86-64)
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/units-completion
          fetch-depth: 0
      - name: Identify the product revision and restore probe controls
        run: |
          git rev-parse HEAD
          git show "$GITHUB_SHA:.github/w7m-author.py" > .github/w7m-author.py
          git show "$GITHUB_SHA:.github/w7m-round2.py" > .github/w7m-round2.py
          git show "$GITHUB_SHA:.github/w7m-new-mutants.py" > .github/w7m-new-mutants.py
          git show "$GITHUB_SHA:tests/probe_w7i.rs" > tests/probe_w7i.rs
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install the shells the hook tests run under
        run: sudo apt-get update && sudo apt-get install -y zsh fish dash
      - name: Baseline, then each mutant with its named killers
        run: python3 .github/w7m-author.py

  mutants:
    name: mutant ${{ matrix.mutant }} must be killed
    needs: compile
    strategy:
      fail-fast: false
      matrix:
        mutant:
          - m1-rule-removed
          - m2-absent-exemption-dropped
          - m3-stale-versions-count-as-kept
          - m4-record-measures-stale
          - m5-no-verdict-line-missing
          - m6-no-verdict-not-raised
          - m7-explain-writes
          - m8-units-how-legacy
          - m9-departed-reader-rule-removed
          - m10-affected-readers-count-as-departed
          - m11-unchanged-inputs-trigger
          - m12-pre-launch-skipped-for-e17
          - m13-gate-removed
          - m14-gate-inverted
          - r3-m1-residue-reset-removed
          - r3-m2-absent-reader-rule-removed
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/units-completion
          fetch-depth: 0
      - name: Identify the product revision and restore probe controls
        run: |
          git rev-parse HEAD
          git show "$GITHUB_SHA:.github/w7m-author.py" > .github/w7m-author.py
          git show "$GITHUB_SHA:.github/w7m-round2.py" > .github/w7m-round2.py
          git show "$GITHUB_SHA:.github/w7m-new-mutants.py" > .github/w7m-new-mutants.py
          git show "$GITHUB_SHA:tests/probe_w7i.rs" > tests/probe_w7i.rs
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install the shells the hook tests run under
        run: sudo apt-get update && sudo apt-get install -y zsh fish dash
      - name: Baseline and named killer for this mutant
        env:
          MUTANT: ${{ matrix.mutant }}
        run: |
          case "$MUTANT" in
            m1-rule-removed|m3-stale-versions-count-as-kept|m5-no-verdict-line-missing|m6-no-verdict-not-raised)
              binary=units_review_r2; test=r2_x02_a_unit_that_stops_reading_in_the_step_its_flag_fails ;;
            m2-absent-exemption-dropped)
              binary=bin; test=run::units::engine::tests::uncovered_changes_do_not_ask_a_launch_to_read_a_deleted_file ;;
            m4-record-measures-stale|m13-gate-removed|m14-gate-inverted)
              binary=bin; test=run::units::bundle::pass_tests::a_record_leaves_the_residue_unknown_when_every_unit_holds_a_version ;;
            m7-explain-writes)
              binary=units_review_r2; test=r2_c3_explain_creates_nothing_in_the_suite_store ;;
            m8-units-how-legacy)
              binary=units_review_r2; test=r2_c5_an_engine_skip_reports_units_on_the_status_descriptor ;;
            m9-departed-reader-rule-removed)
              binary=units_review_r2; test=r2_x01_a_deleted_reader_and_a_subset_in_one_step ;;
            m10-affected-readers-count-as-departed)
              binary=units_review_r2; test=r2_a_departed_reader_shared_with_a_live_unit_takes_the_full_form ;;
            m11-unchanged-inputs-trigger)
              binary=units_review_r2; test=r2_an_unchanged_input_of_a_departed_reader_takes_the_full_form ;;
            m12-pre-launch-skipped-for-e17)
              binary=units_review_r2; test=r2_e17_departed_only_reader_of_a_failing_flag_takes_the_full_form ;;
            r3-m1-residue-reset-removed)
              binary=bin; test=run::units::bundle::keep_tests::a_split_run_without_a_verdict_leaves_the_residue_unknown ;;
            r3-m2-absent-reader-rule-removed)
              binary=units_review_r2; test=r3_removing_the_file_and_its_last_reader_cannot_pass ;;
            *) echo "Unknown mutant $MUTANT"; exit 1 ;;
          esac
          if [ "$binary" = bin ]; then
            target=(--bin stoop)
          else
            target=(--test "$binary")
          fi
          cargo test "${target[@]}" -- --exact "$test" > /tmp/baseline.log 2>&1
          if ! grep -Fqx "test $test ... ok" /tmp/baseline.log; then
            cat /tmp/baseline.log
            echo "BASELINE DID NOT RUN $binary $test"
            exit 1
          fi
          echo "BASELINE PASS $binary $test"
          python3 .github/w7m-round2.py "$MUTANT"
          set +e
          cargo test "${target[@]}" -- --exact "$test" > /tmp/mutant.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 101 ] && grep -Fqx "test $test ... FAILED" /tmp/mutant.log; then
            echo "KILLED $MUTANT by $binary $test"
          else
            cat /tmp/mutant.log
            echo "FAILED TO KILL $MUTANT by $binary $test (exit $rc)"
            exit 1
          fi

  new-mutants:
    name: round four mutants and named killers (x86-64)
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/units-completion
          fetch-depth: 0
      - name: Identify the product revision and restore probe controls
        run: |
          git rev-parse HEAD
          git show "$GITHUB_SHA:.github/w7m-author.py" > .github/w7m-author.py
          git show "$GITHUB_SHA:.github/w7m-round2.py" > .github/w7m-round2.py
          git show "$GITHUB_SHA:.github/w7m-new-mutants.py" > .github/w7m-new-mutants.py
          git show "$GITHUB_SHA:tests/probe_w7i.rs" > tests/probe_w7i.rs
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install fixture shells
        run: sudo apt-get update && sudo apt-get install -y zsh fish dash
      - name: Baselines and mutants
        run: python3 .github/w7m-new-mutants.py
  models:
    name: ${{ matrix.model }} model ${{ matrix.first }} for ${{ matrix.seeds }} seeds (${{ matrix.arch }})
    needs: compile
    strategy:
      fail-fast: false
      matrix:
        include:
          - {model: E3, arch: x86-64, runner: ubuntu-latest, first: 1, seeds: 200}
          - {model: E3, arch: x86-64, runner: ubuntu-latest, first: 7000, seeds: 101}
          - {model: E3, arch: x86-64, runner: ubuntu-latest, first: 10000, seeds: 101}
          - {model: E3, arch: x86-64, runner: ubuntu-latest, first: 13000, seeds: 101}
          - {model: E3, arch: x86-64, runner: ubuntu-latest, first: 14000, seeds: 101}
          - {model: E3, arch: arm64, runner: ubuntu-24.04-arm, first: 1, seeds: 200}
          - {model: E3, arch: arm64, runner: ubuntu-24.04-arm, first: 7000, seeds: 101}
          - {model: E3, arch: arm64, runner: ubuntu-24.04-arm, first: 10000, seeds: 101}
          - {model: E3, arch: arm64, runner: ubuntu-24.04-arm, first: 13000, seeds: 101}
          - {model: E3, arch: arm64, runner: ubuntu-24.04-arm, first: 14000, seeds: 101}
          - {model: M1, arch: x86-64, runner: ubuntu-latest, first: 1, seeds: 200}
          - {model: M1, arch: x86-64, runner: ubuntu-latest, first: 7000, seeds: 101}
          - {model: M1, arch: x86-64, runner: ubuntu-latest, first: 10000, seeds: 101}
          - {model: M1, arch: x86-64, runner: ubuntu-latest, first: 13000, seeds: 101}
          - {model: M1, arch: x86-64, runner: ubuntu-latest, first: 14000, seeds: 101}
          - {model: M1, arch: arm64, runner: ubuntu-24.04-arm, first: 1, seeds: 200}
          - {model: M1, arch: arm64, runner: ubuntu-24.04-arm, first: 7000, seeds: 101}
          - {model: M1, arch: arm64, runner: ubuntu-24.04-arm, first: 10000, seeds: 101}
          - {model: M1, arch: arm64, runner: ubuntu-24.04-arm, first: 13000, seeds: 101}
          - {model: M1, arch: arm64, runner: ubuntu-24.04-arm, first: 14000, seeds: 101}
          - {model: E1, arch: x86-64, runner: ubuntu-latest, first: 1, seeds: 200}
          - {model: E1, arch: x86-64, runner: ubuntu-latest, first: 7000, seeds: 101}
          - {model: E1, arch: x86-64, runner: ubuntu-latest, first: 10000, seeds: 101}
          - {model: E1, arch: x86-64, runner: ubuntu-latest, first: 13000, seeds: 101}
          - {model: E1, arch: x86-64, runner: ubuntu-latest, first: 14000, seeds: 101}
          - {model: E1, arch: arm64, runner: ubuntu-24.04-arm, first: 1, seeds: 200}
          - {model: E1, arch: arm64, runner: ubuntu-24.04-arm, first: 7000, seeds: 101}
          - {model: E1, arch: arm64, runner: ubuntu-24.04-arm, first: 10000, seeds: 101}
          - {model: E1, arch: arm64, runner: ubuntu-24.04-arm, first: 13000, seeds: 101}
          - {model: E1, arch: arm64, runner: ubuntu-24.04-arm, first: 14000, seeds: 101}
          - {model: E2, arch: x86-64, runner: ubuntu-latest, first: 1, seeds: 200}
          - {model: E2, arch: x86-64, runner: ubuntu-latest, first: 7000, seeds: 101}
          - {model: E2, arch: x86-64, runner: ubuntu-latest, first: 10000, seeds: 101}
          - {model: E2, arch: x86-64, runner: ubuntu-latest, first: 13000, seeds: 101}
          - {model: E2, arch: x86-64, runner: ubuntu-latest, first: 14000, seeds: 101}
          - {model: E2, arch: arm64, runner: ubuntu-24.04-arm, first: 1, seeds: 200}
          - {model: E2, arch: arm64, runner: ubuntu-24.04-arm, first: 7000, seeds: 101}
          - {model: E2, arch: arm64, runner: ubuntu-24.04-arm, first: 10000, seeds: 101}
          - {model: E2, arch: arm64, runner: ubuntu-24.04-arm, first: 13000, seeds: 101}
          - {model: E2, arch: arm64, runner: ubuntu-24.04-arm, first: 14000, seeds: 101}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/units-completion
          fetch-depth: 0
      - name: Identify the product revision and restore probe controls
        run: |
          git rev-parse HEAD
          git show "$GITHUB_SHA:.github/w7m-author.py" > .github/w7m-author.py
          git show "$GITHUB_SHA:.github/w7m-round2.py" > .github/w7m-round2.py
          git show "$GITHUB_SHA:.github/w7m-new-mutants.py" > .github/w7m-new-mutants.py
          git show "$GITHUB_SHA:tests/probe_w7i.rs" > tests/probe_w7i.rs
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install the shells the hook tests run under
        run: sudo apt-get update && sudo apt-get install -y zsh fish dash
      - name: E3 flag-readers model
        if: matrix.model == 'E3'
        env:
          STOOP_R2_FIRST: ${{ matrix.first }}
          STOOP_R2_SEEDS: ${{ matrix.seeds }}
          STOOP_R2_STEPS: 30
        run: cargo test --release --test units_review_r2 r2_e3_flag_readers_model -- --nocapture
      - name: M1 model
        if: matrix.model == 'M1'
        env:
          STOOP_MODEL_FIRST: ${{ matrix.first }}
          STOOP_MODEL_SEEDS: ${{ matrix.seeds }}
          STOOP_MODEL_STEPS: 30
        run: cargo test --release --test units_split model_split_runs_give_the_full_runs_verdict -- --nocapture
      - name: E1 renames and re-adds model
        if: matrix.model == 'E1'
        env:
          STOOP_RUNNER_FIRST: ${{ matrix.first }}
          STOOP_RUNNER_SEEDS: ${{ matrix.seeds }}
          STOOP_RUNNER_STEPS: 30
        run: cargo test --release --test units_split_runner model_readds -- --nocapture
      - name: E2 runner-only model
        if: matrix.model == 'E2'
        env:
          STOOP_RUNNER_FIRST: ${{ matrix.first }}
          STOOP_RUNNER_SEEDS: ${{ matrix.seeds }}
          STOOP_RUNNER_STEPS: 30
        run: cargo test --release --test units_split_runner model_runner_only -- --nocapture
