name: W7-4c singleton fallback probe

on:
  push:
    branches: [fix/units-last-launch-evidence]

permissions:
  contents: read

jobs:
  singleton-fallback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Probe the singleton untraced fallback
        run: cargo test --test units_group singleton_untraced_last_launch_cannot_mask_missing_evidence -- --exact --nocapture
