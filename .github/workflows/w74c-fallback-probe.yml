name: W7-4c singleton probes

on:
  push:
    branches: [fix/units-last-launch-evidence]

permissions:
  contents: read

jobs:
  singleton-probes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Probe the singleton launches that cannot exit 0 without evidence
        run: cargo test --test units_group singleton_ -- --nocapture
