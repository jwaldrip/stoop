name: W7 E3 decision boundaries

on:
  push:
    branches: [probe/w7fu-r12b]

permissions:
  contents: read

jobs:
  focused:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check model formatting and clippy
        run: |
          rustfmt --edition 2021 --config skip_children=true --check tests/units_common/mod.rs tests/units_common/engine_model.rs tests/units_review_r2.rs
          cargo clippy --test units_review_r2 -- -D warnings
      - name: Check review and decision boundaries
        run: |
          cargo test --test units_review_r2 r11x_ -- --nocapture --test-threads=1
          cargo test --test units_review_r2 r12_ -- --nocapture --test-threads=1
          cargo test --test units_review_r2 e3_reported_seeds_match_the_owner_approved_shapes -- --nocapture --test-threads=1
      - name: Check earlier controls
        run: |
          cargo test --test units_review_r2 r7_ -- --nocapture --test-threads=1
          cargo test --test units_review_r2 r8_ -- --nocapture --test-threads=1
          cargo test --test units_review_r2 r9_ -- --nocapture --test-threads=1
          cargo test --test units_review_r2 r9x_ -- --nocapture --test-threads=1
          cargo test --test units_review_r2 r10_ -- --nocapture --test-threads=1
          cargo test --test units_review_r2 r10x_ -- --nocapture --test-threads=1
          cargo test --test units_review_r2 r11_reader_ -- --nocapture --test-threads=1
