name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: fmt, clippy, tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Compare recorder performance with base
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          head=$(git rev-parse HEAD)
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          base=$(git rev-parse FETCH_HEAD)
          echo "base=$base head=$head"
          git switch --detach "$base"
          cargo build --release --target-dir "$RUNNER_TEMP/stoop-base"
          git switch --detach "$head"
          STOOP_BENCH_BASE_BIN="$RUNNER_TEMP/stoop-base/release/stoop" STOOP_DEBUG=1 cargo test --release --test record_e2e recorder_base_vs_head_timing_fixture -- --nocapture
      - run: cargo test
      - name: Verify blob IDs above 2 GiB
        run: cargo test --release --test record_e2e sparse_input_over_two_gib_keeps_its_blob_oid -- --ignored --nocapture

  linux-arm:
    name: tests (Linux arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  macos:
    name: build and unit tests (macOS, untraced)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
