name: W7 follow-ups focused probe

on:
  push:
    branches: [probe/w7fu-focused]

permissions:
  contents: read

jobs:
  focused:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check changed Rust formatting
        run: rustfmt --edition 2021 --config skip_children=true --check src/units/attribution.rs tests/units_evidence.rs tests/units_review_r2.rs
      - name: Check the new classifier regressions
        run: |
          cargo test --test units_review_r2 r9x_ -- --nocapture --test-threads=1
          cargo test --test units_review_r2 r10_ -- --nocapture --test-threads=1
      - name: Check the existing classifier boundaries
        run: |
          cargo test --test units_review_r2 r7_ -- --nocapture --test-threads=1
          cargo test --test units_review_r2 r8_ -- --nocapture --test-threads=1
          cargo test --test units_review_r2 r9_ -- --nocapture --test-threads=1
          cargo test --test units_review_r2 e3_gap_accepts_only_the_two_owner_approved_shapes -- --nocapture
          cargo test --test units_review_r2 e3_sticky_retry_requires_the_original_unchanged_runner_only_failures -- --nocapture
      - name: Check untraced percent diagnostic
        run: cargo test --test units_evidence an_untraced_launch_escapes_its_percent_once -- --nocapture --test-threads=1
