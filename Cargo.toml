[package]
name = "stoop"
version = "0.2.0"
edition = "2021"
description = "Run only what matters: skip any command whose observed inputs have not changed since it last passed."
license = "MIT"
repository = "https://github.com/jwaldrip/stoop"
readme = "README.md"
exclude = ["tests/fixtures/attest/test-rsa-*.pkcs8.der"]

[dependencies]
blake3 = "1"
flate2 = { version = "=1.1.11", default-features = false, features = ["rust_backend"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = { version = "=0.4.46", default-features = false }
yaml-rust2 = "0.13"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
