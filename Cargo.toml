[package]
name = "stoop"
version = "0.2.0"
edition = "2021"
description = "Run only what matters: skip any command whose observed inputs have not changed since it last passed."
license = "MIT"
repository = "https://github.com/jwaldrip/stoop"
readme = "README.md"
exclude = ["tests/fixtures/attest/test-rsa-*.pkcs8.der"]

[dependencies]
blake3 = "1"
flate2 = { version = "=1.1.11", default-features = false, features = ["rust_backend"] }
libc = "0.2"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = { version = "=0.4.46", default-features = false }
yaml-rust2 = "0.13"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
